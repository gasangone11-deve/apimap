<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="OpenStreetMap에서 장소를 검색하고 두 지점 사이의 직선거리를 확인하세요."
    />
    <meta name="theme-color" content="#f5f8f6" />
    <title>어디까지? — 두 장소 사이 거리</title>
    <link rel="preconnect" href="https://nominatim.openstreetmap.org" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./style.css" />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
      defer
    ></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <a class="brand" href="./" aria-label="어디까지? 홈">
          <span class="brand-icon" aria-hidden="true">↗</span>
          어디까지?
        </a>
        <p class="eyebrow">PLACE TO PLACE</p>
        <h1>두 장소 사이,<br />얼마나 멀까요?</h1>
        <p class="intro-copy">
          출발지와 도착지를 검색하면 두 지점 사이의 직선거리를 알려드려요.
        </p>
      </header>

      <section class="calculator" aria-label="거리 계산기">
        <div class="location-field" data-field="start">
          <label for="start-input">
            <span class="point point-start" aria-hidden="true"></span>
            출발지
          </label>
          <div class="input-row">
            <input
              id="start-input"
              name="start"
              type="search"
              placeholder="예: 서울역"
              autocomplete="off"
              aria-describedby="start-status"
            />
            <button class="search-button" type="button" data-search="start">
              검색
            </button>
          </div>
          <p class="field-status" id="start-status" aria-live="polite"></p>
          <ul class="results" id="start-results" aria-label="출발지 검색 결과" hidden></ul>
        </div>

        <div class="connector" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <div class="location-field" data-field="destination">
          <label for="destination-input">
            <span class="point point-destination" aria-hidden="true"></span>
            도착지
          </label>
          <div class="input-row">
            <input
              id="destination-input"
              name="destination"
              type="search"
              placeholder="예: 부산역"
              autocomplete="off"
              aria-describedby="destination-status"
            />
            <button class="search-button" type="button" data-search="destination">
              검색
            </button>
          </div>
          <p class="field-status" id="destination-status" aria-live="polite"></p>
          <ul
            class="results"
            id="destination-results"
            aria-label="도착지 검색 결과"
            hidden
          ></ul>
        </div>

        <section class="distance-card" id="distance-card" aria-live="polite" hidden>
          <p class="distance-label">두 장소 사이의 직선거리</p>
          <p class="distance-value" id="distance-value"></p>
          <p class="distance-note">지표면의 곡률을 고려한 두 지점 간 거리예요.</p>
          <button
            class="map-link"
            id="map-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="distance-map"
          >
            지도에서 보기 <span aria-hidden="true">↗</span>
          </button>
          <div class="map-panel" id="distance-map" hidden>
            <p class="map-status" id="map-status" aria-live="polite"></p>
            <div class="map-canvas" id="map-canvas" role="region" aria-label="출발지와 도착지 지도"></div>
            <a class="directions-link" id="directions-link" target="_blank" rel="noopener noreferrer">
              OpenStreetMap에서 길찾기 열기 <span aria-hidden="true">↗</span>
            </a>
          </div>
        </section>
      </section>

      <footer>
        <span>장소 검색 및 지도 데이터</span>
        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">
          © OpenStreetMap contributors
        </a>
      </footer>
    </main>
  </body>
</html>
